name: Deploy demo API

'on':
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: demo-api-source-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::714066696240:role/cmp-demo-github-deployer
          aws-region: ap-northeast-2
          role-session-name: demo-api-${{ github.run_id }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install matching kubectl
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Build, push, and deploy API
        run: bash infra/eks/deploy-main-api.sh
