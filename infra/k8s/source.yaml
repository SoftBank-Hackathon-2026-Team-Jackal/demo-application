apiVersion: v1
kind: Namespace
metadata:
  name: demo-source
  labels:
    app.kubernetes.io/part-of: cmp-demo-source
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cmp-demo-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-config
  namespace: demo-source
data:
  APP_PORT: "8080"
  DB_HOST: demo-db.demo-source.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: demoapp
  DB_USER: demoapp
  S3_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-db
  namespace: demo-source
spec:
  clusterIP: None
  selector:
    app: demo-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-db
  namespace: demo-source
spec:
  serviceName: demo-db
  replicas: 1
  selector:
    matchLabels:
      app: demo-db
  template:
    metadata:
      labels:
        app: demo-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: demoapp
            - name: POSTGRES_USER
              value: demoapp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-api-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 500m, memory: 1Gi}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U demoapp -d demoapp"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: cmp-demo-gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo-source
spec:
  selector:
    app: demo-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-source
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: api
          image: IMAGE_URI_REPLACE_ME
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: demo-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-api-secrets
                  key: DB_PASSWORD
            - name: DEMO_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-api-secrets
                  key: DEMO_WRITE_TOKEN
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  namespace: demo-source
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api
                port:
                  number: 8080
