services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-demoapp}
      POSTGRES_USER: ${DB_USER:-demoapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      APP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
